# autoForge v2 — Oracle free tier (1GB RAM) + Neon Postgres
# Local postgres REMOVED: Neon is the only database.
# RAM note: 1GB is tight. scripts/setup-vm.sh creates a 4GB swapfile first.
services:
  scraper:
    build: { context: ., dockerfile: Dockerfile.scraper }
    restart: unless-stopped
    shm_size: 1gb
    mem_limit: "800m"
    environment:
      GEMINI_API_KEYS: ${GEMINI_API_KEYS}
      AI_MODEL: ${AI_MODEL}
      LINKEDIN_STORAGE_STATE: /data/storage_state.json
      PROFILE_PATH: /app/profile/profile.json
    volumes:
      - ./data/linkedin:/data
      - ./profile:/app/profile:ro

  n8n:
    image: n8nio/n8n:2.35.7
    restart: unless-stopped
    depends_on: { scraper: { condition: service_started } }
    ports: ["127.0.0.1:5678:5678"]   # SSH/VPN tunnel only. Never expose publicly.
    mem_limit: "900m"
    environment:
      GENERIC_TIMEZONE: ${TZ}
      TZ: ${TZ}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      N8N_DIAGNOSTICS_ENABLED: "false"
      NODE_OPTIONS: "--max-old-space-size=640"
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: "168"   # keep execution history 7 days
      SCRAPER_URL: http://scraper:8000
      GEMINI_API_KEYS: ${GEMINI_API_KEYS}
      AI_MODEL: ${AI_MODEL}
      GMAIL_USER: ${GMAIL_USER}
      DRY_RUN: ${DRY_RUN}
      DAILY_OUTREACH_LIMIT: ${DAILY_OUTREACH_LIMIT}
    volumes:
      - n8n_data:/home/node/.n8n
      - ./seed:/seed:ro

volumes:
  n8n_data:
